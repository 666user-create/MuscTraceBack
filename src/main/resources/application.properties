spring.application.name=MusicTraceBack

# ===== 数据库:H2 内嵌,file 模式持久化(重启不丢数据,零外部依赖)=====
spring.datasource.url=jdbc:h2:file:./data/musictraceback;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate 自动建表/更新表结构(开发期方便;生产可改为 validate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 控制台(浏览器访问 /h2-console 调试用;无需可删)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson: 返回空值也序列化,方便前端调试
spring.jackson.default-property-inclusion=always

# 日志
logging.level.org.example.musictraceback=INFO
