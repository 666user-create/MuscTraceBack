spring.application.name=MusicTraceBack

# ===== 数据库:H2 内嵌,file 模式持久化(重启不丢数据,零外部依赖)=====
spring.datasource.url=jdbc:h2:file:./data/musictraceback;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate 自动建表/更新表结构(开发期方便;生产可改为 validate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 控制台(浏览器访问 /h2-console 调试用;无需可删)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson: 返回空值也序列化,方便前端调试
spring.jackson.default-property-inclusion=always

# 日志
logging.level.org.example.musictraceback=INFO

# ===== 平台访问策略(设计文档 NFR-1:限流与降级)=====
# 同一平台连续请求的最小间隔(毫秒),降低触发风控概率
music.http.min-interval-ms=800
# 平台风控(406)退避等待时间(毫秒),之后自动重试一次
music.http.backoff-ms=5000

# 网易云接口基础地址(本环境 HTTPS 被阻断用 HTTP;生产可改 https://music.163.com)
music.netease.base-url=http://music.163.com
