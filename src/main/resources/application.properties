spring.application.name=MusicTraceBack

# ===== 数据库:H2 内嵌,file 模式持久化(重启不丢数据,零外部依赖)=====
spring.datasource.url=jdbc:h2:file:./data/musictraceback;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate 自动建表/更新表结构(开发期方便;生产可改为 validate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 控制台(浏览器访问 /h2-console 调试用;无需可删)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson: 返回空值也序列化,方便前端调试
spring.jackson.default-property-inclusion=always

# 日志
logging.level.org.example.musictraceback=INFO

# ===== 平台访问策略(设计文档 NFR-1:限流与降级)=====
# 同一平台连续请求的最小间隔(毫秒),降低触发风控概率
music.http.min-interval-ms=800
# 平台风控(406)后的冷却期(毫秒):期间该平台请求直接跳过,冷却结束自动恢复
music.http.cooldown-ms=600000
# 断路器:同一主机连续失败(网络异常/5xx)达到该次数后,进入短暂不可用期快速跳过
music.http.failure-threshold=3
music.http.failure-cooldown-ms=120000

# 搜索缓存有效期(毫秒):身份解析与版本发现共用,减少请求量
music.cache.search-ttl-ms=600000

# 网易云接口基础地址(本环境 HTTPS 被阻断用 HTTP;生产可改 https://music.163.com)
music.netease.base-url=http://music.163.com

# QQ 音乐接口(旧 client_search_cp / fcg_v8_playlist_cp 已下线,改用现行接口)
music.qq.playlist-url=https://i.y.qq.com/qzone-music/fcg-bin/fcg_ucc_getcdinfo_byids_cp.fcg
music.qq.musicu-url=https://u.y.qq.com/cgi-bin/musicu.fcg

# 酷狗接口基础地址
music.kugou.base-url=http://mobilecdn.kugou.com
